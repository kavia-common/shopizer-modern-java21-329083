services:
  postgres:
    image: postgres:16
    container_name: shopizer-postgres16
    restart: unless-stopped
    environment:
      # NOTE: these defaults are for local development convenience only.
      # In CI/prod, prefer injecting via environment variables / secrets.
      POSTGRES_DB: shopizer
      POSTGRES_USER: shopizer
      POSTGRES_PASSWORD: shopizer
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: put any init scripts here if you want them auto-run on first boot.
      # - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopizer -d shopizer"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
