server:
  port: ${CATALOG_SERVICE_PORT:8081}

spring:
  application:
    name: catalog-service

  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/shopizer}
    username: ${CATALOG_DB_USER:shopizer}
    password: ${CATALOG_DB_PASSWORD:shopizer}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: catalog

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui
