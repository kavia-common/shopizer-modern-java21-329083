server:
  port: ${CATALOG_SERVICE_PORT:8081}

spring:
  application:
    name: catalog-service

  # Datasource defaults align with infra/db/docker-compose.yml (dev only).
  # In CI/prod, inject via environment variables / secrets.
  datasource:
    url: ${SHOPIZER_DB_URL:${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/shopizer}}
    username: ${SHOPIZER_DB_USER:${CATALOG_DB_USER:shopizer}}
    password: ${SHOPIZER_DB_PASSWORD:${CATALOG_DB_PASSWORD:shopizer}}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    # IMPORTANT:
    # This repository uses a *central* Flyway migrations folder under infra/db/flyway/migrations.
    # The catalog-service runs those migrations (and therefore uses the shared schema contract).
    #
    # For local dev, you can run the infra/db migrations via Flyway CLI (see infra/db/README.md),
    # or by starting the service with Flyway enabled (default).
    #
    # - filesystem:... enables running from the repo root without packaging SQL into the jar.
    # - classpath:db/migration is kept as a fallback for CI/packaged runs if needed.
    locations: filesystem:../infra/db/flyway/migrations,classpath:db/migration
    default-schema: shopizer
    schemas: shopizer

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui
